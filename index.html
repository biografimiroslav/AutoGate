<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gate Control</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #121212;
            color: white;
        }
        .card {
            background: #1e1e1e;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 300px;
        }
        h2 { margin-bottom: 1.5rem; color: #00e676; }
        .btn {
            background: #00e676;
            border: none;
            color: #121212;
            padding: 1.2rem 2rem;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
        }
        .btn:active {
            transform: scale(0.95);
            background: #00c853;
        }
        .status {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Керування воротами</h2>
    <button class="btn" onclick="openGate()">ВІДКРИТИ</button>
    <div id="status" class="status">Готово до роботи</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Твій конфіг, який ти скидав
    const firebaseConfig = {
        apiKey: "AIzaSyChuHidmNhMzksBqrjKciYS8hzbSej1zqU",
        authDomain: "autogate-2fd5a.firebaseapp.com",
        projectId: "autogate-2fd5a",
        databaseURL: "https://autogate-2fd5a-default-rtdb.firebaseio.com",
        storageBucket: "autogate-2fd5a.firebasestorage.app",
        messagingSenderId: "1092222084376",
        appId: "1:1092222084376:web:281a186ed9257ef976aa6d"
    };

    // Ініціалізація
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Функція для відправки "1"
    window.openGate = function() {
        const statusDiv = document.getElementById('status');
        statusDiv.innerText = "Відправка команди...";
        statusDiv.style.color = "#00e676";

        // Записуємо 1 в gate_control
        set(ref(db, 'gate_control'), "1")
        .then(() => {
            statusDiv.innerText = "Команду надіслано!";
            setTimeout(() => {
                statusDiv.innerText = "Готово до роботи";
                statusDiv.style.color = "#888";
            }, 2000);
        })
        .catch((error) => {
            statusDiv.innerText = "Помилка: " + error.message;
            statusDiv.style.color = "#ff5252";
        });
    }
</script>

</body>
</html>
